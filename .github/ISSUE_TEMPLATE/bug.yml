name: Ошибка
description: Что-то не работает или работает не так
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали и что получили.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия Суфлёра
      description: Настройки → Справка, первая строка.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Подключение к модели
      options:
        - Claude, ключ API
        - Claude Code
        - OpenAI / OpenRouter / Gemini
        - DeepSeek / Qwen / Kimi / GLM
        - GigaChat / YandexGPT
        - Ollama / LM Studio
        - Другое
  - type: input
    id: hardware
    attributes:
      label: Windows и видеокарта
      placeholder: Windows 11 24H2, RTX 3060 12 ГБ
  - type: textarea
    id: log
    attributes:
      label: Лог
      description: Настройки → Отладка → «Открыть папку логов». Приложите файл за нужный день. Проверьте, что в нём нет личного.
      render: text
