name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Core format
        run: cargo fmt --manifest-path core/Cargo.toml --all --check
      - name: Core lints
        run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-machete,cargo-deny
      - name: Unused dependencies
        run: cargo machete core
      - name: Dependency advisories and sources
        run: cargo deny --manifest-path core/Cargo.toml check advisories bans sources
      # Runs `cargo test` instrumented; fails if line coverage drops under the floor.
      - name: Core tests and coverage
        run: cargo llvm-cov --manifest-path core/Cargo.toml --workspace --summary-only --fail-under-lines 60
      # `cargo test` regenerates the UI's protocol types (ts-rs); a diff means they were not committed.
      - name: Protocol types are up to date
        run: git diff --exit-code -- ui/src/shared/generated
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI typecheck, lint, tests and build
        working-directory: ui
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run coverage
          npm audit --omit=dev --audit-level=high
          npm run build
