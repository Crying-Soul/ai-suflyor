<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'" />
  <meta name="description" content="Настройки ассистента звонков, хранятся в config.json." />
  <title>Настройки</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header class="window-head">
    <h1>Настройки</h1>
    <span id="cfg-path" class="path"></span>
  </header>
  <div class="layout">
    <nav aria-label="Разделы"><ul id="sections"></ul></nav>
    <form id="form" autocomplete="off">
      <p class="loading">Загружаю настройки…</p>
    </form>
  </div>
  <footer class="actions">
    <span id="save-state" role="status"></span>
    <button id="btn-cancel" class="btn-ghost" type="button">Закрыть</button>
    <button id="btn-save" class="btn" type="submit" form="form">Сохранить и перезапустить</button>
  </footer>
  <script src="settings.js"></script>
</body>
</html>
