<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'" />
  <meta name="description" content="Settings of the call assistant, stored in config.json." />
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <header class="window-head">
    <h1>Settings</h1>
    <span id="cfg-path" class="path"></span>
  </header>
  <div class="layout">
    <nav aria-label="Sections"><ul id="sections"></ul></nav>
    <form id="form" autocomplete="off">
      <p class="loading">Loading the config…</p>
    </form>
  </div>
  <footer class="actions">
    <span id="save-state" role="status"></span>
    <button id="btn-cancel" class="btn-ghost" type="button">Close</button>
    <button id="btn-save" class="btn" type="submit" form="form">Save and restart</button>
  </footer>
  <script src="settings.js"></script>
</body>
</html>
