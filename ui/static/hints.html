<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'" />
  <meta name="description" content="Подсказки Claude к вопросам собеседника: короткая строка, полный ответ и история." />
  <title>Подсказки</title>
  <link rel="stylesheet" href="hints.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="title">Подсказки</span>
      <span class="spacer"></span>
      <button id="btn-model" class="btn-ghost small" type="button" title="Переключить модель" hidden></button>
      <button id="btn-help" class="icon-btn" type="button" title="Справка: что умеет приложение и как оно устроено" aria-label="Справка">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" /><path d="M7.8 7.8a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4" /><path d="M10 14.6v.1" /></svg>
      </button>
      <button id="btn-hide" class="icon-btn" type="button" title="Скрыть это окно. Ctrl+Shift+H скрывает оба" aria-label="Скрыть">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
      </button>
    </header>

    <div class="state">
      <span id="chip" class="chip" role="status" data-phase="idle">Слушаю</span>
      <span class="spacer"></span>
      <span id="latency" class="num"></span>
      <span id="nav" class="nav" hidden>
        <button id="btn-prev" class="icon-btn" type="button" data-action="prevAnswer" data-label="Предыдущий ответ"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5l-5 5 5 5" /></svg></button>
        <span id="nav-pos" class="num"></span>
        <button id="btn-next" class="icon-btn" type="button" data-action="nextAnswer" data-label="Следующий ответ"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M8 5l5 5-5 5" /></svg></button>
      </span>
      <button id="btn-copy" class="icon-btn" type="button" data-action="copyAnswer" data-label="Копировать ответ" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="1.5" /><path d="M13 7V5a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 0 4 5v8a1.5 1.5 0 0 0 1.5 1.5H7" /></svg></button>
    </div>

    <section id="turns" aria-label="Подсказки" aria-live="polite">
      <div class="empty">
        <p>Здесь появится подсказка, как только собеседник задаст вопрос. Спросить вручную: Ctrl+Shift+Space.</p>
        <p id="no-claude" class="empty-hint" hidden>Claude не подключён, подсказок не будет. <button id="btn-ready" class="btn-ghost small" type="button">Подключить</button></p>
      </div>
    </section>

    <footer>
      <button id="btn-ask" class="btn" type="button" data-action="ask" data-label="Подсказка на последний вопрос"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5v6a1.5 1.5 0 0 1-1.5 1.5H9l-3.5 3v-3h0A1.5 1.5 0 0 1 4 11.5z" /></svg><span class="label">Спросить</span></button>
      <button id="btn-shot" class="btn-ghost" type="button" data-action="screenshotAsk" data-label="Снимок активного окна с последним вопросом; без вопроса решает задачу на экране"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="14" height="9.5" rx="1.5" /><path d="M7.5 16.5h5M10 13.5v3" /></svg><span class="label">Экран</span></button>
      <button id="btn-continue" class="btn-ghost" type="button" data-action="continueTalk" data-label="Три фразы, как продолжить ваш ответ"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 10h10M10 6l4 4-4 4" /><path d="M17 5v10" /></svg><span class="label">Что сказать</span></button>
      <button id="btn-questions" class="btn-ghost" type="button" data-action="myQuestions" data-label="Что спросить у собеседника"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7" /><path d="M8 8a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.3v.3M10 14v.1" /></svg><span class="label">Вопросы</span></button>
    </footer>
  </div>
  <script src="hints.js"></script>
</body>
</html>
