<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'" />
  <meta name="description" content="Подсказки Claude к вопросам собеседника: короткая строка, полный ответ и история." />
  <title>Подсказки</title>
  <link rel="stylesheet" href="hints.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <span data-mark></span><span class="title">Подсказки</span>
      <span class="spacer"></span>
      <button id="btn-model" class="btn-ghost small" type="button" title="Модель полной подсказки. Щелчок переключает на другую" hidden></button>
      <button id="btn-help" class="icon-btn" type="button" title="Справка: что умеет приложение и как оно устроено" aria-label="Справка">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" /><path d="M7.8 7.8a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4" /><path d="M10 14.6v.1" /></svg>
      </button>
      <button id="btn-hide" class="icon-btn" type="button" data-action="toggleWindow" data-label="Скрыть оба окна. Вернуть: те же клавиши или значок в трее">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
      </button>
    </header>

    <div class="state">
      <span id="chip" class="chip" role="status" data-phase="idle">Слушаю</span>
      <span class="spacer"></span>
      <span id="talk" class="talk num" role="status" hidden></span>
      <span id="latency" class="num"></span>
      <span id="nav" class="nav" hidden>
        <button id="btn-prev" class="icon-btn" type="button" data-action="prevAnswer" data-label="Предыдущий ответ"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5l-5 5 5 5" /></svg></button>
        <span id="nav-pos" class="num"></span>
        <button id="btn-next" class="icon-btn" type="button" data-action="nextAnswer" data-label="Следующий ответ"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M8 5l5 5-5 5" /></svg></button>
      </span>
      <button id="btn-up" class="icon-btn rate" type="button" data-action="rateUp" data-label="Ответ полезен" aria-pressed="false" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6.5 9.5v7h-2.5v-7zM6.5 9.5l3-6c1.2 0 2 .9 1.8 2.1l-.5 2.4h4.2a1.5 1.5 0 0 1 1.5 1.8l-1 5a1.5 1.5 0 0 1-1.5 1.2h-7.5" /></svg></button>
      <button id="btn-down" class="icon-btn rate" type="button" data-action="rateDown" data-label="Ответ мимо" aria-pressed="false" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M13.5 10.5v-7h2.5v7zM13.5 10.5l-3 6c-1.2 0-2-.9-1.8-2.1l.5-2.4h-4.2a1.5 1.5 0 0 1-1.5-1.8l1-5a1.5 1.5 0 0 1 1.5-1.2h7.5" /></svg></button>
      <button id="btn-copy" class="icon-btn" type="button" data-action="copyAnswer" data-label="Копировать ответ" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="7" y="7" width="9" height="10" rx="1.5" /><path d="M13 7V5a1.5 1.5 0 0 0-1.5-1.5h-6A1.5 1.5 0 0 0 4 5v8a1.5 1.5 0 0 0 1.5 1.5H7" /></svg></button>
    </div>
    <div class="wait keep-motion" aria-hidden="true"></div>

    <p id="say" class="visually-hidden" role="status"></p>
    <section id="turns" aria-label="Подсказки">
      <div class="empty">
        <p>Здесь появится подсказка, как только собеседник задаст вопрос. Спросить вручную: <span data-key="ask"></span>.</p>
        <p id="no-claude" class="empty-hint" hidden>Claude не подключён, подсказок не будет. <button id="btn-ready" class="btn-ghost small" type="button">Подключить</button></p>
      </div>
    </section>

    <footer>
      <button id="btn-ask" class="btn" type="button" data-action="ask" data-label="Спросить: подсказка на последний вопрос собеседника"><span class="label">Спросить</span></button>
      <button id="btn-shot" class="btn-ghost" type="button" data-action="screenshotAsk" data-label="Снимок активного окна с последним вопросом; без вопроса решает задачу на экране"><span class="label">Экран</span></button>
      <button id="btn-continue" class="btn-ghost" type="button" data-action="continueTalk" data-label="Что сказать: три фразы, как продолжить ваш собственный ответ"><span class="label">Что сказать</span></button>
      <button id="btn-questions" class="btn-ghost" type="button" data-action="myQuestions" data-label="Вопросы: что спросить у собеседника"><span class="label">Вопросы</span></button>
    </footer>
  </div>
  <script src="hints.js"></script>
</body>
</html>
