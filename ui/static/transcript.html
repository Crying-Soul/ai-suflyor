<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'" />
  <meta name="description" content="Живой транскрипт звонка: обе стороны, текст появляется прямо во время речи." />
  <title>Транскрипт</title>
  <link rel="stylesheet" href="transcript.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="title">Транскрипт</span>
      <button id="btn-call" class="call-chip" type="button" title="Звонки: папки, контекст, итоги">Без звонка</button>
      <span class="spacer"></span>
      <button id="btn-help" class="icon-btn" type="button" title="Справка: что умеет приложение и как оно устроено" aria-label="Справка">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7.5" /><path d="M7.8 7.8a2.3 2.3 0 1 1 3.2 2.1c-.6.3-1 .8-1 1.5v.4" /><path d="M10 14.6v.1" /></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 6h9M15 6h2M3 14h2M8 14h9" /><circle cx="13.5" cy="6" r="1.8" /><circle cx="6.5" cy="14" r="1.8" /></svg>
      </button>
      <button id="btn-hide" class="icon-btn" type="button" title="Скрыть это окно. Ctrl+Shift+H скрывает оба" aria-label="Скрыть">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
      </button>
    </header>

    <div id="setup" class="setup" role="alert" hidden>
      <p id="setup-text"></p>
      <button id="btn-setup" class="btn small" type="button">Открыть</button>
    </div>

    <div class="sources">
      <div class="src"><button id="mute-me" class="icon-btn mic" type="button" role="switch" aria-checked="true" title="Микрофон: распознавать вашу речь. Выключен — ваш звук не слушаю" aria-label="Микрофон: распознавать вашу речь. Выключен — ваш звук не слушаю"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 10 3zM5 9.5a5 5 0 0 0 10 0M10 14.5V17" /><path class="slash" d="M4 4l12 12" /></svg></button><span id="lbl-me" class="lbl">Я</span><div class="meter"><div id="meter-me"></div></div><span id="src-me" class="srcname"></span></div>
      <div class="src"><button id="mute-them" class="icon-btn mic" type="button" role="switch" aria-checked="true" title="Звук собеседника: распознавать его речь. Выключен — его звук не слушаю" aria-label="Звук собеседника: распознавать его речь. Выключен — его звук не слушаю"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M10 3a2.5 2.5 0 0 0-2.5 2.5v4a2.5 2.5 0 0 0 5 0v-4A2.5 2.5 0 0 0 10 3zM5 9.5a5 5 0 0 0 10 0M10 14.5V17" /><path class="slash" d="M4 4l12 12" /></svg></button><span id="lbl-them" class="lbl">Собеседник</span><div class="meter"><div id="meter-them"></div></div><span id="src-them" class="srcname"></span></div>
    </div>

    <div class="scroll-wrap">
      <section id="transcript" aria-label="Транскрипт">
        <div class="empty">
          <p>Текст появится, как только кто-то заговорит.</p>
          <p class="empty-hint">Полоски «Я» и «Собеседник» вверху двигаются, когда звук доходит. Если они стоят на месте — «Настройки» → «Звук».</p>
        </div>
      </section>
      <button id="jump" class="pill" type="button" hidden>Новые реплики ниже</button>
    </div>

    <p id="live" class="live" role="status"><span class="mark"></span><span id="live-word"></span></p>

    <div id="owed" class="owed" role="status" hidden>
      <p><span class="owed-label">Вопрос без ответа</span><span id="owed-text" class="owed-text"></span></p>
      <button id="btn-owed" class="btn-ghost small" type="button">Спросить</button>
    </div>

    <footer>
      <div class="panel" role="toolbar" aria-label="Управление">
        <div class="grp">
        <button id="btn-auto" class="switch" type="button" role="switch" aria-checked="false" data-action="toggleAuto" data-label="Отвечать на вопросы автоматически">Авто</button>
        <button id="btn-translate" class="switch" type="button" role="switch" aria-checked="false" data-action="translate" data-label="Переводить речь собеседника на ваш язык">Перевод</button>
        </div>
        <div class="grp tools">
        <button id="btn-camera" class="icon-btn mode" type="button" data-action="cameraMode" data-label="«У камеры»: подсказки полоской у камеры"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2" /><path d="M6.5 7.5h7" /></svg></button>
        <button id="btn-through" class="icon-btn mode" type="button" data-action="clickThrough" data-label="Клики сквозь окна. Выключается только клавишами: кнопки в этом режиме не нажимаются"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4.5 3.5l4 11 1.6-4.6 4.6-1.6z" /><path d="M12.5 12.5l3.5 3.5" /></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="icon-btn" type="button" data-action="zoomOut" data-label="Мельче текст"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5" /><path d="M12.2 12.2l4 4M6.3 8.5h4.4" /></svg></button>
        <button class="icon-btn" type="button" data-action="zoomIn" data-label="Крупнее текст"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5" /><path d="M12.2 12.2l4 4M6.3 8.5h4.4M8.5 6.3v4.4" /></svg></button>
        <span class="sep" aria-hidden="true"></span>
        <button class="icon-btn" type="button" data-action="toggleWindow" data-label="Скрыть оба окна (вернуть — те же клавиши или значок в трее)"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 10s2.6-5 7-5 7 5 7 5-2.6 5-7 5-7-5-7-5z" /><circle cx="10" cy="10" r="2" /><path d="M4 4l12 12" /></svg></button>
        <button id="btn-clear" class="icon-btn" type="button" title="Очистить транскрипт и подсказки" aria-label="Очистить транскрипт и подсказки">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10" /></svg>
        </button>
        </div>
      </div>
      <p class="statusline"><span id="status" role="status">запускаю ядро…</span><span id="through-note" class="through-note"></span></p>
    </footer>
  </div>
  <script src="transcript.js"></script>
</body>
</html>
