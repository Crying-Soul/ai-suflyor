[package]
name = "suflyor-core"
edition.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hound.workspace = true
protocol.workspace = true
audio.workspace = true
vad.workspace = true
stt.workspace = true
textproc.workspace = true
mt.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
futures-util = "0.3"
pdf-extract = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
