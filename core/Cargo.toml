[workspace]
resolver = "3"
members = ["crates/protocol", "crates/audio", "crates/vad", "crates/stt", "crates/textproc", "crates/mt", "suflyor-core"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasapi = "0.26.0"
hound = "3.5.1"
rtrb = "0.4.1"
rubato = "5.0.1"
sysinfo = "0.40.1"
protocol = { path = "crates/protocol" }
audio = { path = "crates/audio" }
vad = { path = "crates/vad" }
stt = { path = "crates/stt" }
textproc = { path = "crates/textproc" }
mt = { path = "crates/mt" }

[profile.release]
opt-level = 3
lto = "thin"
debug = "line-tables-only"
